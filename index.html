<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JMG | بوابة الموارد البشرية</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>
  (function(){try{var d=document.documentElement,l=localStorage.getItem('jmg_lang')||'ar';d.lang=l;d.dir=l==='ar'?'rtl':'ltr';d.setAttribute('data-theme','dark');}catch(e){}})();
</script>
</head>
<body class="login-page">
<canvas id="bg" aria-hidden="true"></canvas>

<header class="login-hero">
  <div class="login-tools">
    <button class="btn-icon lang" id="langBtn"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span></span></button>
  </div>
  <div class="logo-full reveal"><img src="logo.png" alt="JMG Real Estate" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="logo-text">JMG Real Estate</span></div>
  <h1 class="reveal" data-i18n="login_h">أهلاً بيك في بوابة JMG</h1>
  <p class="reveal" data-i18n="login_p">سجّل دخولك بالإيميل أو الكود الوظيفي وكمّل شغلك.</p>
</header>

<main class="card login-card reveal" data-tilt="4">
  <h2 data-i18n="login_card">تسجيل الدخول</h2>
  <form class="form" id="loginForm" novalidate>
    <div class="field">
      <label for="login" data-i18n="f_login">الإيميل أو الكود الوظيفي</label>
      <input class="input" id="login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required>
    </div>
    <div class="field">
      <label for="password" data-i18n="f_password">كلمة المرور</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" dir="ltr" required>
    </div>
    <div class="err-line" id="err" role="alert"></div>
    <button class="btn btn-gold btn-block" id="goBtn" type="submit" data-i18n="btn_login">دخول</button>
  </form>
</main>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/login.js"></script>
</body>
</html>
