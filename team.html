<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JMG | بوابة الموارد البشرية</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>
  (function(){try{var d=document.documentElement,l=localStorage.getItem('jmg_lang')||'ar';d.lang=l;d.dir=l==='ar'?'rtl':'ltr';d.setAttribute('data-theme','dark');}catch(e){}})();
</script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>

    <section class="hero">
      <div class="hero-row">
        <div class="reveal">
          <h1 data-i18n="nav_team">بيانات الفريق</h1>
          <p data-i18n="team_sub">دوّر على أي حد من فريقك وشوف حضوره والخصومات.</p>
        </div>
      </div>
    </section>

    <div class="content">
      <section class="card reveal search-card">
        <div class="search-row">
          <div class="field sugg">
            <label for="q" data-i18n="f_search_emp">ابحث بالاسم أو الكود</label>
            <input class="input" id="q" type="search" autocomplete="off" data-i18n-ph="ph_search_emp" placeholder="اكتب اسم الموظف أو كوده…" role="combobox" aria-expanded="false" aria-controls="sugg">
            <div class="sugg-list" id="sugg" role="listbox" hidden></div>
          </div>
          <div class="field"><label for="month" data-i18n="f_month">الشهر</label><input class="input" id="month" type="month"></div>
        </div>
      </section>

      <section class="card reveal">
        <div class="empty" id="pick" data-i18n="team_pick">اختار موظف من فريقك عشان تشوف بياناته.</div>
        <div id="empView" hidden>
          <div class="card-h"><div><h3 id="empName"></h3><div class="sub" id="empMeta"></div></div></div>
          <div class="sum-grid" id="sum"></div>
          <p class="note pend" id="noData" hidden data-i18n="no_data_note"></p>
          <div class="tbl-wrap">
            <table class="tbl" style="min-width:820px"><thead><tr id="dayHead"></tr></thead><tbody id="dayBody"></tbody></table>
          </div>
        </div>
      </section>

      <section class="card reveal">
        <div class="card-h"><h3 data-i18n="msn_title">المأموريات</h3></div>
        <div class="tbl-wrap">
          <table class="tbl" style="min-width:560px">
            <thead><tr><th data-i18n="th_date">التاريخ</th><th data-i18n="col_area">المنطقة / المشروع</th><th data-i18n="col_amount">المبلغ</th><th data-i18n="col_notes">ملاحظات</th><th data-i18n="col_link">رابط الموقع</th></tr></thead>
            <tbody id="msnBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/payroll.js"></script>
<script src="js/attview.js"></script>
<script src="js/team.js"></script>
</body>
</html>
