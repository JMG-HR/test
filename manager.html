<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JMG | بوابة الموارد البشرية</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>
  (function(){try{var d=document.documentElement,l=localStorage.getItem('jmg_lang')||'ar';d.lang=l;d.dir=l==='ar'?'rtl':'ltr';d.setAttribute('data-theme','dark');}catch(e){}})();
</script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>

    <section class="hero">
      <div class="hero-row">
        <div class="reveal">
          <h1 id="greet">…</h1>
          <p data-i18n="mgr_sub">راجع طلبات فريقك وخد قرارك بسرعة.</p>
        </div>
      </div>
    </section>

    <div class="content">
      <div class="g3">
        <section class="card reveal" data-tilt>
          <div class="card-h"><div style="display:flex;align-items:center;gap:12px"><div class="ico-chip" id="icoPend"></div><h3 data-i18n="m_pending">مستنية قرارك</h3></div></div>
          <div class="big"><span id="sPend">0</span></div>
        </section>
        <section class="card reveal" data-tilt>
          <div class="card-h"><div style="display:flex;align-items:center;gap:12px"><div class="ico-chip" id="icoOk"></div><h3 data-i18n="m_approved">اتوافق عليها الشهر ده</h3></div></div>
          <div class="big"><span id="sOk">0</span></div>
        </section>
        <section class="card accent reveal" data-tilt="5">
          <div>
            <h3 id="accTitle">…</h3>
          </div>
          <div class="stat" style="background:rgba(255,255,255,.12);color:#fff;width:fit-content;min-width:150px">
            <span style="color:rgba(255,255,255,.75)" data-i18n="m_team">عدد أفراد الفريق</span><b id="sTeam">0</b>
          </div>
        </section>
      </div>

      <section class="card reveal">
        <div class="card-h">
          <h3 data-i18n="mgr_card">طلبات الفريق</h3>
          <div class="tabs" role="tablist">
            <button class="on" data-tab="pending" role="tab" data-i18n="tab_pending">مستنية قرارك</button>
            <button data-tab="all" role="tab" data-i18n="tab_all">كل الطلبات</button>
          </div>
        </div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr>
              <th data-i18n="th_emp">الموظف</th><th data-i18n="th_type">النوع</th><th data-i18n="th_details">التفاصيل</th><th data-i18n="th_status">الحالة</th><th data-i18n="th_action">الإجراء</th>
            </tr></thead>
            <tbody id="body"><tr><td colspan="5"><div class="sk" style="height:44px"></div></td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/manager.js"></script>
</body>
</html>
